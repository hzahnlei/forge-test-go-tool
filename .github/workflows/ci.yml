name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    container:
      image: davidanson/markdownlint-cli2:v0.23.3
      options: --user root
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        run: markdownlint-cli2

  commit-lint:
    name: Commit lint
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/shell-tools:1.2.1
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | \
          grep -qE "^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?(!)?: .{1,100}$" \
            || { echo "ERROR: PR title does not follow Conventional Commits spec"; exit 1; }

  scan-source:
    name: Scan source
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.74.0
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets and vulnerabilities
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL --scanners secret,vuln .

  arch-test:
    name: Arch test
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/go-build:1.5.0
    env:
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=readonly
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/go-mod
          key: go-go-tool-${{ hashFiles('go.sum') }}
          restore-keys: go-go-tool-
      - name: Arch test
        run: make arch-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arch-test-results
          path: test_reports/arch-test/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/go-build:1.5.0
    env:
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=readonly
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/go-mod
          key: go-go-tool-${{ hashFiles('go.sum') }}
          restore-keys: go-go-tool-
      - name: Lint
        run: make lint-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: test_reports/linting/

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/shell-tools:1.2.1
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: make lint-shell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-shell-results
          path: test_reports/linting/
  lint-dbc:
    name: Lint DBC files
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/cantools:1.0.1
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - name: Lint DBC files
        run: make lint-dbc

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/go-build:1.5.0
    env:
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=readonly
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/go-mod
          key: go-go-tool-${{ hashFiles('go.sum') }}
          restore-keys: go-go-tool-
      - name: Test
        run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test_reports/

  bdd-test:
    name: BDD Test
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/go-build:1.5.0
    env:
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=readonly
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/go-mod
          key: go-go-tool-${{ hashFiles('go.sum') }}
          restore-keys: go-go-tool-
      - name: BDD Test
        run: make bdd-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdd-test-results
          path: test_reports/bdd-test/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/go-build:1.5.0
    env:
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=readonly
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/go-mod
          key: go-go-tool-${{ hashFiles('go.sum') }}
          restore-keys: go-go-tool-
      - name: Coverage
        run: make coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: test_reports/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/go-build:1.5.0
    env:
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=readonly
    needs: [arch-test, lint]
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/go-mod
          key: go-go-tool-${{ hashFiles('go.sum') }}
          restore-keys: go-go-tool-
      - name: Debug build
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: binary-debug
          path: build/go-tool-debug

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/go-build:1.5.0
    env:
      GOMODCACHE: /tmp/go-mod
      GOFLAGS: -mod=readonly
    needs: [arch-test, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/go-mod
          key: go-go-tool-${{ hashFiles('go.sum') }}
          restore-keys: go-go-tool-
      - name: Release build
        run: make release-build
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: build/go-tool

  build-debug-image:
    name: Build Debug image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-debug
          path: build
      - uses: docker/setup-buildx-action@v3
      - name: Build Debug image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          target: debug
          push: false
          outputs: type=docker,dest=image-debug.tar
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-debug
      - uses: actions/upload-artifact@v4
        with:
          name: image-debug
          path: image-debug.tar
          retention-days: 7

  scan-debug-image:
    name: Scan Debug image
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.74.0
    needs: build-debug-image
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-debug
      - name: Scan image (report)
        run: trivy image --input image-debug.tar --severity HIGH,CRITICAL --exit-code 0
      - name: Scan image (gate)
        run: trivy image --input image-debug.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  push-debug-image:
    name: Push Debug image
    runs-on: ubuntu-latest
    needs: [build-debug-image, scan-debug-image]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-debug
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push
        run: |
          docker load --input image-debug.tar
          docker push "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-debug"

  build-release-image:
    name: Build image
    runs-on: ubuntu-latest
    needs: release-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: build
      - uses: docker/setup-buildx-action@v3
      - name: Build Release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          target: release
          push: false
          outputs: type=docker,dest=image-release.tar
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: image-release.tar
          retention-days: 7

  scan-release-image:
    name: Scan image
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.74.0
    needs: build-release-image
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-release
      - name: Scan image (report)
        run: trivy image --input image-release.tar --severity HIGH,CRITICAL --exit-code 0
      - name: Scan image (gate)
        run: trivy image --input image-release.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  push-release-image:
    name: Push image
    runs-on: ubuntu-latest
    needs: [build-release-image, scan-release-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-release
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push
        run: |
          docker load --input image-release.tar
          docker tag "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" "ghcr.io/${{ github.repository }}:latest"
          docker push "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository }}:latest"

  promote-release-image:
    name: Promote image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Retag without rebuilding
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --tag "ghcr.io/${{ github.repository }}:stable" \
            "ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"

  scan-promoted-image:
    name: Scan promoted image
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.74.0
    needs: promote-release-image
    if: "!cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v'))"
    permissions:
      packages: read
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Scan image (report)
        run: trivy image --image-src remote --severity HIGH,CRITICAL --exit-code 0 "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
      - name: Scan image (gate)
        run: trivy image --image-src remote --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"

  release:
    name: Release
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/shell-tools:1.2.1
    needs: [promote-release-image, scan-promoted-image]
    if: "!cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v'))"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate the release notes
        run: |
          git config --global --add safe.directory "$PWD"
          git cliff --tag "${{ github.ref_name }}" --latest -o RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md

  docs:
    name: Docs
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/hzahnlei/build-images/mkdocs:1.5.3
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build docs
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            sed -i "/^site_name: /s/\"$/ (${{ github.ref_name }})\"/" mkdocs.yml
          else
            sed -i "/^site_name: /s/\"$/ (docs built $(date -u +%Y-%m-%d))\"/" mkdocs.yml
          fi
          make docs-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4

